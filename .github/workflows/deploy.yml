name: Deploy Static Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para el despliegue automático en GitHub Pages mediante OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Prevenir despliegues simultáneos en cola
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-creditos/package-lock.json

      - name: Instalar Dependencias del Frontend
        working-directory: ./frontend-creditos
        run: npm ci

      - name: Compilar Frontend con Vite
        working-directory: ./frontend-creditos
        run: npm run build

      - name: Preparar Artefacto de GitHub Pages (SPA Fallback & NoJekyll)
        run: |
          mkdir -p dist-pages
          cp -r frontend-creditos/dist/* dist-pages/
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
          echo "=== Contenido verificado de la raíz del artefacto ==="
          ls -la dist-pages

      - name: Validar Presencia de index.html en la Raíz
        run: |
          if [ ! -f "dist-pages/index.html" ]; then
            echo "[-] Error crítico: index.html no existe en la raíz de dist-pages"
            exit 1
          fi
          echo "[+] Verificación exitosa: index.html y 404.html presentes en la raíz del artefacto."

      - name: Subir Artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist-pages'

  deploy:
    name: Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
