name: Deploy Static Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para el despliegue automático en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevenir despliegues simultáneos en cola
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-creditos/package-lock.json

      - name: Instalar Dependencias del Frontend
        working-directory: ./frontend-creditos
        run: npm ci

      - name: Compilar Frontend con Vite
        working-directory: ./frontend-creditos
        env:
          GITHUB_ACTIONS: 'true'
          VITE_BASE_PATH: '/aurum-bpm-credit-core/'
        run: npm run build

      - name: Configurar SPA Fallback (404.html)
        run: cp frontend-creditos/dist/index.html frontend-creditos/dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Artefacto Compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend-creditos/dist'

  deploy:
    name: Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
